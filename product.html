<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | آوادرس</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .detail-page {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }
    .detail-page img {
      width: 100%;
      border-radius: 14px;
      object-fit: cover;
    }
    .detail-info h1 { margin-top: 0; }
    .detail-info select, .detail-info button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }
    .detail-info button { cursor: pointer; }
    @media (max-width: 650px) {
      .detail-page { grid-template-columns: 1fr; margin: 16px auto; }
    }
  </style>
</head>
<body>
  <main id="product-detail" class="detail-page">
    <p>در حال بارگذاری محصول...</p>
  </main>
  <script src="product.js"></script>
</body>
</html>
