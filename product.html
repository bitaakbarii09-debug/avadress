<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | آوادرس</title>
  <link rel="stylesheet" href="style.css">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --pink: #e88aaa;
  --pink-dark: #cf668d;
  --pink-soft: #fff1f6;
  --pink-border: #f3d5e1;
  --text: #3f3036;
  --muted: #9a858d;
  --white: #fff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 35px 16px 60px;
  direction: rtl;
  font-family: "Vazirmatn", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top right, #ffe3ed 0, transparent 35%),
    linear-gradient(135deg, #fff8fb, #fff);
}

.detail-page {
  width: min(1050px, 100%);
  margin: auto;
  padding: 35px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 55px;
  align-items: center;

  background: rgba(255,255,255,.96);
  border: 1px solid var(--pink-border);
  border-radius: 32px;

  box-shadow:
    0 25px 70px rgba(190, 91, 125, .12);
}

/* تصویر محصول */

.product-image-box {
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px;

  background: linear-gradient(145deg, #fff4f8, #fff);
  border-radius: 28px;
}

.product-image-box img {
  width: 100%;
  max-height: 520px;
  object-fit: cover;
  border-radius: 24px;

  box-shadow: 0 18px 45px rgba(150, 80, 105, .12);
}

/* اطلاعات */

.detail-info {
  padding: 10px;
}

.product-label {
  display: inline-block;
  padding: 7px 15px;
  margin-bottom: 15px;

  background: var(--pink-soft);
  color: var(--pink-dark);

  border-radius: 50px;
  font-size: 13px;
  font-weight: 700;
}

.detail-info h1 {
  margin: 0 0 12px;

  color: #3d2d34;
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 800;
  line-height: 1.5;
}

.product-description {
  margin: 0 0 20px;

  color: var(--muted);
  font-size: 15px;
  line-height: 2;
}

.price {
  margin: 20px 0 30px;

  color: var(--pink-dark);
  font-size: 25px;
  font-weight: 800;
}

/* گروه انتخاب */

.option-group {
  margin: 25px 0;
}

.option-title {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 13px;

  font-size: 15px;
  font-weight: 700;
}

.option-title span:last-child {
  color: var(--muted);
  font-weight: 500;
}

/* رنگ‌ها */

.color-options {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.color-choice {
  width: 38px;
  height: 38px;

  padding: 0;
  margin: 0;

  border: 3px solid white;
  border-radius: 50%;

  background: var(--color);
  box-shadow: 0 0 0 1px #ead6de;

  cursor: pointer;
  transition: .2s ease;
}

.color-choice:hover {
  transform: scale(1.08);
}

.color-choice.selected {
  box-shadow:
    0 0 0 2px var(--pink),
    0 5px 15px rgba(210, 90, 130, .2);
}

/* سایز */

.size-options {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.size-choice {
  min-width: 54px;

  padding: 11px 15px;

  border: 1px solid var(--pink-border);
  border-radius: 12px;

  background: white;
  color: var(--text);

  font-family: inherit;
  font-size: 14px;
  font-weight: 600;

  cursor: pointer;
  transition: .2s ease;
}

.size-choice:hover {
  border-color: var(--pink);
  color: var(--pink-dark);
}

.size-choice.selected {
  background: var(--pink);
  border-color: var(--pink);
  color: white;

  box-shadow: 0 7px 18px rgba(215, 102, 143, .2);
}

/* دکمه سبد */

.add-cart {
  width: 100%;

  margin-top: 30px;
  padding: 16px 20px;

  border: 0;
  border-radius: 15px;

  background: linear-gradient(
    135deg,
    #ee9bb8,
    #d96f97
  );

  color: white;

  font-family: inherit;
  font-size: 16px;
  font-weight: 800;

  cursor: pointer;

  box-shadow: 0 12px 25px rgba(210, 92, 132, .22);

  transition: .2s ease;
}

.add-cart:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(210, 92, 132, .28);
}

.add-cart:active {
  transform: translateY(0);
}

.detail-message {
  min-height: 25px;
  margin: 14px 0;

  color: var(--pink-dark);
  font-size: 14px;
  font-weight: 600;
}

.back-link {
  display: inline-block;

  margin-top: 8px;

  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
}

.back-link:hover {
  color: var(--pink-dark);
}

/* موبایل */

@media (max-width: 750px) {

  body {
    padding: 15px 10px 40px;
  }


.back-link:hover {
  color: var(--pink-dark);
}

/* موبایل */

@media (max-width: 750px) {

  body {
    padding: 15px 10px 40px;
  }

  .detail-page {
    grid-template-columns: 1fr;
    gap: 25px;

    padding: 18px;

    border-radius: 24px;
  }

  .product-image-box {
    min-height: auto;
    padding: 12px;
  }

  .product-image-box img {
    max-height: 430px;
  }

  .detail-info {
    padding: 5px;
  }

  .detail-info h1 {
    font-size: 28px;
  }

  .price {
    font-size: 22px;
  }
  /* کارت‌های خدمات آوادرس */
.service-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 24px;
}

.service-card {
  background: #fff;
  border: 1px solid #f5dce5;
  border-radius: 16px;
  padding: 16px 10px;
  text-align: center;
  color: #75485a;
  font-size: 13px;
  line-height: 1.9;
}

.service-card .service-icon {
  display: block;
  font-size: 25px;
  margin-bottom: 6px;
}

@media (max-width: 480px) {
  .service-cards {
    gap: 8px;
  }

  .service-card {
    padding: 12px 6px;
  }
  .service-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin: 30px auto;
  width: 100%;
  box-sizing: border-box;
}

.service-card {
  background: #fff7fa;
  border: 1px solid #f3d6e1;
  border-radius: 18px;
  padding: 20px 12px;
  text-align: center;
  color: #75485a;
  box-shadow: 0 4px 14px rgba(220, 150, 175, 0.12);
  font-size: 14px;
  line-height: 1.9;
}

.service-card .service-icon {
  display: block;
  font-size: 28px;
  margin-bottom: 8px;
}

.service-card p {
  margin: 6px 0 0;
  color: #88717b;
  font-size: 12px;
}

@media (max-width: 480px) {
  .service-cards {
    gap: 8px;
  }

  .service-card {
    padding: 14px 6px;
  }
.service-cards {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 14px !important;
  margin: 30px auto !important;
  width: 100% !important;
  box-sizing: border-box !important;
}

.service-card {
  background: #fff0f6 !important;
  border: 1px solid #f3c6d8 !important;
  border-radius: 18px !important;
  padding: 20px 12px !important;
  text-align: center !important;
  color: #75485a !important;
  box-shadow: 0 4px 14px rgba(220, 150, 175, 0.2) !important;
}
  </style>
</head>
<body>
  <main id="product-detail" class="detail-page">
    <p>در حال بارگذاری محصول...</p>
  </main>
  <script src="product.js"></script>
</body>
</html>
