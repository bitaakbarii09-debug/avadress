<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | آوادرس</title>
  <link rel="stylesheet" href="style.css">
  <style>
  body {
    background: #f7f3ef;
  }

  .detail-page {
    max-width: 1000px;
    margin: 35px auto;
    padding: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 35px rgba(65, 42, 30, 0.1);
  }

  .detail-page img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 18px;
    background: #eee;
  }

  .detail-info {
    padding: 10px;
  }

  .detail-info h1 {
    font-size: 32px;
    color: #30251f;
    margin-bottom: 15px;
  }

  .detail-info p {
    color: #776b63;
    line-height: 2;
    font-size: 16px;
  }

  .detail-info h2 {
    color: #a45e43;
    font-size: 28px;
    margin: 24px 0;
  }

  .detail-info label {
    display: block;
    margin-top: 22px;
    margin-bottom: 8px;
    font-weight: bold;
    color: #45372f;
  }

  .detail-info select {
    display: block;
    width: 100%;
    padding: 14px;
    border: 1px solid #ded4cc;
    border-radius: 12px;
    background: #fffdfb;
    font-size: 16px;
  }

  .detail-info button {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #30251f;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }

  .detail-info button:hover {
    background: #a45e43;
    transform: translateY(-2px);
  }

  .detail-info a {
    display: inline-block;
    margin-top: 24px;
    color: #a45e43;
    text-decoration: none;
    font-weight: bold;
  }

  #detail-message {
    color: #287448;
    font-weight: bold;
  }

  @media (max-width: 650px) {
    .detail-page {
      grid-template-columns: 1fr;
      margin: 14px;
      padding: 16px;
      gap: 18px;
      border-radius: 18px;
    }

    .detail-page img {
      max-height: 380px;
    }

    .detail-info {
      padding: 4px;
    }

    .detail-info h1 {
      font-size: 27px;
    }

    .detail-info h2 {
      font-size: 24px;
    }
  }
  </style>
</head>
<body>
  <main id="product-detail" class="detail-page">
    <p>در حال بارگذاری محصول...</p>
  </main>
  <script src="product.js"></script>
</body>
</html>
