<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | آوادرس</title>
  <link rel="stylesheet" href="style.css">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --pink: #e88cae;
  --pink-dark: #ce638c;
  --pink-light: #fff0f5;
  --white: #ffffff;
  --text: #49343d;
  --muted: #927d86;
  --border: #f3dce5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px 50px;
  direction: rtl;
  font-family: 'Vazirmatn', sans-serif;
  background: linear-gradient(145deg, #fff7fa, #fff 55%, #fff0f5);
  color: var(--text);
  min-height: 100vh;
}

.detail-page {
  max-width: 850px;
  margin: 25px auto;
  padding: 28px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid var(--border);
  border-radius: 28px;
  box-shadow: 0 12px 40px rgba(206, 99, 140, 0.10);
}

.detail-page h1 {
  color: var(--pink-dark);
  font-size: clamp(24px, 5vw, 34px);
  font-weight: 800;
  margin: 0 0 18px;
  line-height: 1.8;
}

.detail-page p {
  color: var(--muted);
  font-size: 15px;
  line-height: 2;
}

.detail-page img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 20px auto;
  border-radius: 22px;
}

.detail-page button,
.detail-page select,
.detail-page input {
  font-family: inherit;
  font-size: 15px;
  border-radius: 13px;
}

.detail-page button {
  border: 1px solid var(--pink);
  background: var(--pink);
  color: white;
  padding: 12px 20px;
  margin: 6px 4px;
  cursor: pointer;
  font-weight: 700;
  transition: 0.2s ease;
}

.detail-page button:hover {
  background: var(--pink-dark);
  transform: translateY(-1px);
}

.detail-page select,
.detail-page input {
  border: 1px solid var(--border);
  background: #fff9fb;
  color: var(--text);
  padding: 11px 13px;
  outline: none;
  max-width: 100%;
}

.detail-page select:focus,
.detail-page input:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(232, 140, 174, 0.15);
}

.detail-page a {
  color: var(--pink-dark);
  text-decoration: none;
}

.detail-page a:hover {
  text-decoration: underline;
}

#cart-items {
  margin-top: 20px;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  .detail-page {
    padding: 18px;
    margin: 12px auto;
    border-radius: 22px;
  }

  .detail-page button {
    padding: 11px 15px;
  }
}
    </style>
</head>
<body>
  <main id="product-detail" class="detail-page">
    <p>در حال بارگذاری محصول...</p>
  </main>
  <script src="product.js"></script>
</body>
</html>
