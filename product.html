<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | آوادرس</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .detail-page {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }
    .detail-page img {
      width: 100%;
      border-radius: 14px;
      object-fit: cover;
    }
    .detail-info h1 { margin-top: 0; }
    .detail-info select, .detail-info button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }
    .detail-info button { cursor: pointer; }
    @media (max-width: 650px) {
      .detail-page { grid-template-columns: 1fr; margin: 16px auto; }
    }
    .detail-page {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
}

.detail-page img {
  aspect-ratio: 4 / 5;
  object-fit: cover;
  background: #f5f5f5;
}

.detail-info h1 {
  font-size: 28px;
  color: #292929;
  margin-bottom: 12px;
}

.detail-info h2 {
  color: #a05a45;
  font-size: 24px;
}

.detail-info label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

.detail-info select {
  border: 1px solid #ddd;
  background: #fff;
  font-size: 16px;
}

.detail-info button {
  background: #292929;
  color: white;
  border: none;
  font-size: 17px;
  font-weight: bold;
  margin-top: 22px;
}

.detail-info button:hover {
  background: #a05a45;
}

.detail-info a {
  display: inline-block;
  margin-top: 20px;
  color: #a05a45;
  text-decoration: none;
}

@media (max-width: 650px) {
  .detail-page {
    padding: 16px;
    gap: 20px;
  }

  .detail-info h1 {
    font-size: 24px;
  }
}
  </style>
</head>
<body>
  <main id="product-detail" class="detail-page">
    <p>در حال بارگذاری محصول...</p>
  </main>
  <script src="product.js"></script>
</body>
</html>
